<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stream Counter Control</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 40px;
        }

        .counter {
            margin: 30px auto;
            max-width: 400px;
            font-size: 28px;
        }

        button {
            font-size: 24px;
            padding: 10px 25px;
            margin: 10px;
            cursor: pointer;
        }

        .number {
            display: inline-block;
            min-width: 60px;
        }

        .reset {
            margin-top: 40px;
            background: #b00020;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Stream Counter Control</h1>

    <div class="counter">
        <div>
            WINS:
            <span class="number" id="wins">0</span>
        </div>

        <button onclick="changeCounter('wins', -1)">−</button>
        <button onclick="changeCounter('wins', 1)">+</button>
    </div>

    <div class="counter">
        <div>
            LOSSES:
            <span class="number" id="losses">0</span>
        </div>

        <button onclick="changeCounter('losses', -1)">−</button>
        <button onclick="changeCounter('losses', 1)">+</button>
    </div>

    <button class="reset" onclick="resetCounters()">RESET</button>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue,
            set
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


        const firebaseConfig = {
            apiKey: "AIzaSyCVaMI6Ko7FqckRK7TMQ578cVaHyQHV5DA",
            authDomain: "stream-counter-4b751.firebaseapp.com",
            databaseURL: "https://stream-counter-4b751-default-rtdb.firebaseio.com",
            projectId: "stream-counter-4b751",
            storageBucket: "stream-counter-4b751.firebasestorage.app",
            messagingSenderId: "882850513261",
            appId: "1:882850513261:web:95bf244dbaac1f3540da64",
            measurementId: "G-5D71WEPPXJ"
        };


        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);

        const counterRef = ref(database, "counter");


        onValue(counterRef, (snapshot) => {

            const data = snapshot.val();

            if (data) {
                document.getElementById("wins").textContent = data.wins ?? 0;
                document.getElementById("losses").textContent = data.losses ?? 0;
            }

        });


        window.changeCounter = function(type, amount) {

            onValue(counterRef, (snapshot) => {

                const data = snapshot.val() || {
                    wins: 0,
                    losses: 0
                };

                let newValue = (data[type] || 0) + amount;

                if (newValue < 0) {
                    newValue = 0;
                }

                data[type] = newValue;

                set(counterRef, data);

            }, {
                onlyOnce: true
            });

        };


        window.resetCounters = function() {

            set(counterRef, {
                wins: 0,
                losses: 0
            });

        };

    </script>

</body>
</html>
